<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Forecast</title>
    <link rel="stylesheet" href="forecast.css" />
  </head>
  <body>
    <div class="weather-container">
      <div class="location-header">
        <span>&larr;</span>
        <h2>7-Days Forecast</h2>
      </div>

      <div class="weather-alert">
        <img
          src="https://cdn-icons-png.flaticon.com/512/1163/1163657.png"
          alt="cloud"
        />
        <p>
          <small>15 minutes ago</small><br />The wind is very strong today! This
          is not the time for a yacht trip.
        </p>
      </div>

      <div class="forecast">
        <h3>Next week</h3>
        <ul>
          <li><span>Sun</span><span>28° 21°</span><span>🌤️</span></li>
          <li><span>Mon</span><span>27° 20°</span><span>🌤️</span></li>
          <li><span>Tue</span><span>25° 18°</span><span>🌧️</span></li>
          <li><span>Wed</span><span>28° 22°</span><span>☀️</span></li>
          <li><span>Thu</span><span>23° 18°</span><span>🌫️</span></li>
          <li><span>Fri</span><span>23° 17°</span><span>🌫️</span></li>
          <li><span>Sat</span><span>29° 19°</span><span>🌤️</span></li>
        </ul>
      </div>
    </div>
  </body>
</html>
