<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App UI</title>
    <link rel="stylesheet" href="rainy.css" />
    <link rel="stylesheet" href="sunny.js" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="weather-card">
      <div class="top">
        <div class="location">
          <div id="location">
            <i class="fa-solid fa-location-dot"></i>
          </div>
          Bhaktapur
          <div class="search">
            <span>🔍</span>
          </div>
        </div>
        <div class="calendar">📅</div>
      </div>

      <div class="weather-icon">
        <div class="rain">🌧️</div>
      </div>

      <div class="temperature">
        <p class="description">It's raining</p>
        <h1>15°</h1>
        <div class="info">
          <span>🌬️ 15 km/h</span>
          <span>💧 75%</span>
        </div>
      </div>

      <div class="forecast">
        <div class="day">
          <p>Sunday</p>
          <p>🌧️</p>
          <p>17°</p>
        </div>
        <div class="day">
          <p>Monday</p>
          <p>🌧️</p>
          <p>18°</p>
        </div>
        <div class="day">
          <p>Tuesday</p>
          <p>🌦️</p>
          <p>20°</p>
        </div>
      </div>
    </div>
  </body>
</html>
